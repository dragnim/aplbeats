<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APL Beats — a generative rhythm machine and Tone sequencer</title>
    <meta
      name="description"
      content="A browser drum machine and Tone sequencer: eight drum tracks and one Tone phrase, sixteen steps each. Generate them, then transform them with real Dyalog APL and hear the result."
    />

    <meta property="og:title" content="APL Beats — a generative rhythm machine and Tone sequencer" />
    <meta
      property="og:description"
      content="A browser drum machine and Tone sequencer. Press Play, edit the grid or the Tone phrase, and hear it change."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:title" content="APL Beats — a generative rhythm machine and Tone sequencer" />
    <meta
      name="twitter:description"
      content="A browser drum machine and Tone sequencer. Press Play, edit the grid or the Tone phrase, and hear it change."
    />

    <!--
      Both themes, so the browser paints its own chrome and the scrollbars to match rather than
      assuming dark. theme-color is given twice, one per scheme, which is how a browser is told
      what to tint the address bar with in each.
    -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0d0e11" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef0f4" media="(prefers-color-scheme: light)" />

    <!--
      One origin beyond our own, and only one: https://tryapl.org, where APL actually
      runs. Everything else is still served from here — every sound is synthesised in
      the browser and the APL font is bundled — so `connect-src` names exactly the two
      places this application may talk to and nothing else.

      Deliberately not widened further. No wildcard, no scheme-only source, and no
      second host "in case". If a transform ever needs somewhere else to run, that is a
      decision to be made and written down rather than one already permitted.

      `frame-ancestors` is deliberately absent: browsers ignore it in a meta element
      and log a console error for it. Blocking framing needs a real response header,
      which GitHub Pages cannot set.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://tryapl.org; base-uri 'self'; form-action 'none'; object-src 'none'"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>APL Beats needs JavaScript to synthesise its sounds and run the sequencer.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
